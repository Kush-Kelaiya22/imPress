# Tool configuration only; the backend is not packaged from here.

[tool.ruff]
target-version = "py312"
extend-exclude = ["firmware/*/managed_components", "frontend/node_modules"]

[tool.ruff.lint]
# pyflakes (F: undefined names, unused imports/variables, redefinitions) plus
# syntax/IO errors (E9). Low-noise rules that catch real bugs.
select = ["F", "E9"]

[tool.coverage.run]
# SQLAlchemy's async engine runs ORM code in greenlets and TestClient serves
# the app from a worker thread; without these, Python 3.12's tracer misses
# most route code (55.6% reported vs 79.1% measured with sys.monitoring).
concurrency = ["greenlet", "thread"]
