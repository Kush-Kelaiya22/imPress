name: Release

# Releases and the backend image (#96, #100, #104). See docs/guides/releases.md.
#
# - After CI passes on a push to an integration line <owner>/vMAJOR.MINOR
#   (owners in RELEASE_OWNERS): the release is <owner>/vMAJOR.MINOR.PATCH,
#   PATCH = first-parent commits since <owner>/vMAJOR.MINOR.0
#   (scripts/release.py). If it doesn't exist yet and the line's page
#   template (docs/releases/vMAJOR.MINOR.md) is present, stamp the version
#   into the build, tag the exact commit, build the firmware, the image and
#   the zip files, and publish the release. Its "What changed" section is the
#   CHANGELOG.md entries added since the previous release of the line.
#   The script and the page templates always come from the default branch,
#   so a line branched long ago still releases with the current rules.
# - On issue changes, daily, and on demand: a release is Beta while an open
#   issue labelled `testing` is in a milestone that gates it (its line
#   <owner>/vX.Y, any line it is built on, or its exact <owner>/vX.Y.Z),
#   Stable otherwise. The image tags <owner>-<X.Y>, <owner>-beta and
#   <owner>-latest follow.
#
# issues, schedule and workflow_run events run this file from the default
# branch (varun/v2.1).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["varun/**", "kush/**", "aamna/**", "encrypted/**"]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned, deleted, transferred]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs queue on their own, so a burst of issue events can't push a
# release run out of the queue. Nothing is cancelled once started.
concurrency:
  group: release-${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && 'publish' || 'status' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kush-kelaiya22/impress-backend
  PYTHON_VERSION: "3.12"
  RELEASE_OWNERS: varun kush aamna encrypted

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only a successful CI run for a push can publish (the plan checks the branch).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      owner: ${{ steps.plan.outputs.owner }}
      line: ${{ steps.plan.outputs.line }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      asset: ${{ steps.plan.outputs.asset }}
      create: ${{ steps.plan.outputs.create }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0          # the patch number counts commits since the line's .0 tag
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git rev-parse HEAD)
          publish=false; create=false
          # The current rules and templates, applied to the pushed commit.
          git show "origin/$DEFAULT_BRANCH:scripts/release.py" > "$RUNNER_TEMP/release.py"
          mkdir -p "$RUNNER_TEMP/defaults"
          git archive "origin/$DEFAULT_BRANCH" docs/releases | tar -x -C "$RUNNER_TEMP/defaults"
          plan=$(python3 "$RUNNER_TEMP/release.py" plan --branch "$BRANCH" --root . --templates "$RUNNER_TEMP/defaults/docs/releases")
          echo "branch=$BRANCH plan=$plan" >> "$GITHUB_STEP_SUMMARY"
          get() { jq -r ".$1 // empty" <<<"$plan"; }
          # Only CI-tested pushes and manual runs publish, and only from an integration line.
          if { [ "$EVENT" = workflow_run ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$(get releasable)" = true ]; then
            publish=true
            gh release view "$(get tag)" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || create=true
          fi
          echo "publish=$publish create=$create" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "sha=$sha"; echo "owner=$(get owner)"; echo "line=$(get line)"; echo "version=$(get version)"; echo "tag=$(get tag)"
            echo "previous=$(get previous)"; echo "asset=$(get asset)"; echo "publish=$publish"; echo "create=$create"
          } >> "$GITHUB_OUTPUT"

  image-build:
    # One native build per architecture (#136): GitHub's arm64 runners avoid
    # QEMU, and each image is smoke-tested on the architecture it targets.
    name: Backend image (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Use the containerd image store
        # The classic store pushes Docker v2 manifests; their manifest list
        # can't carry annotations, so the package page lost its description
        # (#136). The containerd store pushes OCI images and indexes.
        run: |
          f=/etc/docker/daemon.json
          { sudo test -s "$f" && sudo cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" > /dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          for _ in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Stamp the release version
        run: printf '%s\n' "${{ needs.plan.outputs.version }}" > VERSION
      - name: Build
        run: docker build --platform linux/${{ matrix.arch }} --label "org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}" --label "org.opencontainers.image.version=${{ needs.plan.outputs.tag }}" -t impress-backend:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name impress -p 8000:8000 -e IMPRESS_REQUIRE_HTTPS=false -e IMPRESS_INITIAL_ADMIN_PASSWORD=smoke-${{ github.run_id }} impress-backend:ci
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          key=$(docker exec impress sed -n 's/^IMPRESS_DEVICE_API_KEY=\([^ #]*\).*/\1/p' /data/.env)
          python scripts/smoke_test.py --password "smoke-${{ github.run_id }}" --device-key "$key"
          test "$(docker exec impress id -u)" = 10001
          test "$(docker exec impress uname -m)" = "$([ ${{ matrix.arch }} = arm64 ] && echo aarch64 || echo x86_64)"
      - name: Container log
        if: always()
        run: docker logs impress 2>&1 | grep -v 'Device API key' || true
      - name: Push the architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A registry hiccup ("unknown blob") used to fail the whole release (#136).
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed; retrying in 20 s" >&2; sleep 20; done; return 1; }
          t="$IMAGE:sha-${SHA:0:12}-${{ matrix.arch }}"
          docker tag impress-backend:ci "$t"
          retry docker push "$t"
          echo "pushed $t" >> "$GITHUB_STEP_SUMMARY"

  image:
    # Join the architecture images into one multi-platform tag (#136); `docker
    # pull` then picks the right one. The annotations fill the package page.
    name: Backend image
    needs: [plan, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Multi-platform tags
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          OWNER: ${{ needs.plan.outputs.owner }}
          LINE: ${{ needs.plan.outputs.line }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          CREATE: ${{ needs.plan.outputs.create }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed; retrying in 20 s" >&2; sleep 20; done; return 1; }
          tags=("$OWNER-$LINE" "sha-${SHA:0:12}")
          [ "$CREATE" = true ] && tags+=("$OWNER-$VERSION")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          docs="https://github.com/${{ github.repository }}/blob/${SHA}/docs/deployment/container.md"
          retry docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.title=imPress backend" \
            --annotation "index:org.opencontainers.image.description=imPress classroom response system: REST API, WebSocket rooms, firmware store and web app. linux/amd64 and linux/arm64. Run: docker run -d -p 8000:8000 -v impress-data:/data <image>. Guide: $docs" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.documentation=$docs" \
            --annotation "index:org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --annotation "index:org.opencontainers.image.version=$TAG" \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            "$IMAGE:sha-${SHA:0:12}-amd64" "$IMAGE:sha-${SHA:0:12}-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-${SHA:0:12}" | tee -a "$GITHUB_STEP_SUMMARY"
          # Fail loudly rather than publish an index without its annotations again.
          docker buildx imagetools inspect "$IMAGE:sha-${SHA:0:12}" --raw | jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            and (.annotations["org.opencontainers.image.description"] // "" | length > 0)
            and ([.manifests[].platform.architecture] | index("amd64") and index("arm64"))' > /dev/null
          for t in "${tags[@]}"; do echo "pushed $IMAGE:$t (amd64, arm64)" >> "$GITHUB_STEP_SUMMARY"; done

  firmware:
    name: Firmware (${{ matrix.project }})
    needs: plan
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      matrix:
        project: [class_c6, class_s3, student]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: idf.py build (version stamped into the app descriptor)
        shell: bash
        run: |
          printf '%s\n' "${{ needs.plan.outputs.version }}" > firmware/${{ matrix.project }}/version.txt
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py build
          # One file for a whole new board (#155): bootloader, partition table,
          # OTA data and the app at their offsets, flashed at 0x0.
          idf.py merge-bin -o "${{ matrix.project }}-full.bin"
      - name: Collect the images and their flash layout
        shell: bash
        run: |
          src=firmware/${{ matrix.project }}/build; out=out/${{ matrix.project }}
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$src"/*.bin "$src/flash_args" "$src/flasher_args.json" "$out/"
          cp "$src/bootloader/bootloader.bin" "$out/bootloader/"
          cp "$src/partition_table/partition-table.bin" "$out/partition_table/"
          cp "$src/${{ matrix.project }}-full.bin" "$out/"
          (cd "$out" && find . -name '*.bin' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firmware-${{ matrix.project }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: [plan, image, firmware]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write          # creates the line's milestone on its first release
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      OWNER: ${{ needs.plan.outputs.owner }}
      LINE: ${{ needs.plan.outputs.line }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      NAME: ${{ needs.plan.outputs.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-firmware-*
          path: firmware-images
          merge-multiple: true
      - name: Build the release files
        run: |
          mkdir -p dist stage
          # Release page: the line's template, the CHANGELOG entries new since the previous
          # release, and the merged pull requests.
          args=(-f tag_name="$TAG" -f target_commitish="$SHA")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" -q .body > prs.md
          git show "origin/$DEFAULT_BRANCH:scripts/release.py" > "$RUNNER_TEMP/release.py"
          mkdir -p "$RUNNER_TEMP/defaults"
          git archive "origin/$DEFAULT_BRANCH" docs/releases | tar -x -C "$RUNNER_TEMP/defaults"
          python3 "$RUNNER_TEMP/release.py" notes "$TAG" prs.md --root . --templates "$RUNNER_TEMP/defaults/docs/releases" > notes.md
          # Firmware: one folder per board, flashable with esptool (see the release page).
          (cd firmware-images && zip -qr "../dist/$NAME-firmware.zip" .)
          # Documentation: repository docs, the changelog, the wiki and the release page.
          mkdir -p "stage/$NAME-docs"
          for f in README.md CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md docs; do
            [ -e "$f" ] && cp -r "$f" "stage/$NAME-docs/"
          done
          cp notes.md "stage/$NAME-docs/RELEASE_NOTES.md"
          git clone -q --depth 1 "https://github.com/$GITHUB_REPOSITORY.wiki.git" "stage/$NAME-docs/wiki"
          rm -rf "stage/$NAME-docs/wiki/.git"
          (cd stage && zip -qr "../dist/$NAME-docs.zip" "$NAME-docs")
          # Bundle: the source at the release commit with the release version, the firmware and the page.
          git archive --format=tar --prefix="$NAME/" "$SHA" | tar -x -C stage
          printf '%s\n' "$VERSION" | tee "stage/$NAME/VERSION" stage/"$NAME"/firmware/{class_c6,class_s3,student}/version.txt >/dev/null
          mkdir -p "stage/$NAME/release"
          cp -r firmware-images "stage/$NAME/release/firmware"
          cp notes.md "stage/$NAME/release/RELEASE_NOTES.md"
          (cd stage && zip -qr "../dist/$NAME.zip" "$NAME")
          # Single-file images per board, flashable at 0x0 (#155).
          for p in class_c6:gateway-esp32c6 class_s3:hub-esp32s3 student:student-esp32; do
            cp "firmware-images/${p%%:*}/${p%%:*}-full.bin" "dist/$NAME-${p#*:}-full.bin"
          done
          (cd dist && sha256sum ./*.zip ./*.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Milestone for the line
        run: |
          # Test issues for every release of the line (and of lines built on it) go here.
          title="$OWNER/v$LINE"
          if ! gh api "repos/$GITHUB_REPOSITORY/milestones?state=all" --paginate -q '.[].title' | grep -qx "$title"; then
            gh api "repos/$GITHUB_REPOSITORY/milestones" -f title="$title" \
              -f description="Release line $title. Open issues labelled 'testing' keep its releases (and releases built on it) in Beta." >/dev/null
            echo "created milestone $title" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag the release commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)" = "$SHA"
      - name: Publish
        run: |
          # The complete page from the start: status section (badges, Beta/Stable box,
          # test issues), install guide and changes. Editable later: the status job only
          # replaces the marked status section.
          meta=$(python3 "$RUNNER_TEMP/release.py" page "$TAG" notes.md --sha "$SHA" --out body.md --root .)
          flags=()
          [ "$(jq -r .prerelease <<<"$meta")" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag "${flags[@]}" --title "$(jq -r .title <<<"$meta")" \
            --notes-file body.md dist/*.zip dist/*.bin dist/SHA256SUMS.txt
          echo "Published $TAG at $SHA: $(jq -r .status <<<"$meta")" >> "$GITHUB_STEP_SUMMARY"

  status:
    name: Release status
    needs: [plan, release]
    # Runs for every event, after a release (if one was created) is published.
    if: always() && !cancelled() && needs.release.result != 'failure' && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0          # every tag, to see which lines a release is built on
      - name: Beta or Stable
        run: python3 scripts/release.py sync | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Image tags (<owner>-<X.Y>, <owner>-latest, <owner>-beta)
        run: |
          plan=$(python3 scripts/release.py channels)
          echo "$plan" >> "$GITHUB_STEP_SUMMARY"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          exists() { docker buildx imagetools inspect "$IMAGE:$1" >/dev/null 2>&1; }
          digest() { docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest.Digest}}' 2>/dev/null; }
          # Releases published before owner-prefixed names (#104) have plain version tags.
          jq -r '.legacy | to_entries[] | "\(.key) \(.value)"' <<<"$plan" | while read -r target source; do
            if ! exists "$target" && exists "$source"; then
              docker buildx imagetools create -t "$IMAGE:$target" "$IMAGE:$source"
            fi
          done
          jq -r '.aliases | to_entries[] | "\(.key) \(.value)"' <<<"$plan" | while read -r alias source; do
            if ! exists "$source"; then echo "no image $IMAGE:$source; $alias not moved"; continue; fi
            if [ "$(digest "$alias")" != "$(digest "$source")" ]; then
              docker buildx imagetools create -t "$IMAGE:$alias" "$IMAGE:$source"
              echo "$alias -> $source" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
