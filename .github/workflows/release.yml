name: Release

# Releases and the backend image (#96, #100). See docs/guides/releases.md.
#
# - After CI passes on a push to the default branch: the release version is
#   MAJOR.MINOR from VERSION plus PATCH = first-parent commits since the
#   line's vMAJOR.MINOR.0 tag (scripts/release.py). If that release doesn't
#   exist yet and the line's notes (docs/releases/vMAJOR.MINOR.md) are
#   present, stamp the version into the build, tag the exact commit, build the
#   firmware, the image and the zip files, and publish the release.
# - On issue changes, daily, and on demand: a release is Beta while an open
#   issue labelled `testing` is in milestone vMAJOR.MINOR (or vVERSION),
#   Stable otherwise. The image tags `beta` and `latest` follow.
#
# issues, schedule and workflow_run events run this file from the default
# branch (varun/v2.1).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["varun/**"]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned, deleted, transferred]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs queue on their own, so a burst of issue events can't push a
# release run out of the queue. Nothing is cancelled once started.
concurrency:
  group: release-${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && 'publish' || 'status' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kush-kelaiya22/impress-backend
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only a successful CI run for a push to the default branch can publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      create: ${{ steps.plan.outputs.create }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0          # the patch number counts commits since the line's .0 tag
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git rev-parse HEAD)
          plan=$(python3 scripts/release.py plan)
          version=$(jq -r .version <<<"$plan"); tag=$(jq -r .tag <<<"$plan"); previous=$(jq -r .previous <<<"$plan")
          publish=false; create=false
          # A manual run publishes only from the default branch.
          if [ "$EVENT" = workflow_run ] || { [ "$EVENT" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; }; then
            publish=true
            if [ "$(jq -r .notes_present <<<"$plan")" = true ] && ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              create=true
            fi
          fi
          echo "sha=$sha version=$version tag=$tag previous=$previous publish=$publish create=$create" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "sha=$sha"; echo "version=$version"; echo "tag=$tag"; echo "previous=$previous"; echo "publish=$publish"; echo "create=$create"; } >> "$GITHUB_OUTPUT"

  image:
    name: Backend image
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp the release version
        run: printf '%s\n' "${{ needs.plan.outputs.version }}" > VERSION
      - name: Build
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}" --label "org.opencontainers.image.version=${{ needs.plan.outputs.version }}" -t impress-backend:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name impress -p 8000:8000 -e IMPRESS_INITIAL_ADMIN_PASSWORD=smoke-${{ github.run_id }} impress-backend:ci
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          key=$(docker exec impress sed -n 's/^IMPRESS_DEVICE_API_KEY=\([^ #]*\).*/\1/p' /data/.env)
          python scripts/smoke_test.py --password "smoke-${{ github.run_id }}" --device-key "$key"
          test "$(docker exec impress id -u)" = 10001
      - name: Container log
        if: always()
        run: docker logs impress 2>&1 | grep -v 'Device API key' || true
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          CREATE: ${{ needs.plan.outputs.create }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags=(edge "sha-${SHA:0:12}")
          [ "$CREATE" = true ] && tags+=("$VERSION")
          for t in "${tags[@]}"; do
            docker tag impress-backend:ci "$IMAGE:$t"
            docker push "$IMAGE:$t"
            echo "pushed $IMAGE:$t" >> "$GITHUB_STEP_SUMMARY"
          done

  firmware:
    name: Firmware (${{ matrix.project }})
    needs: plan
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      matrix:
        project: [class_c6, class_s3, student]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: idf.py build (version stamped into the app descriptor)
        shell: bash
        run: |
          printf '%s\n' "${{ needs.plan.outputs.version }}" > firmware/${{ matrix.project }}/version.txt
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py build
      - name: Collect the images and their flash layout
        shell: bash
        run: |
          src=firmware/${{ matrix.project }}/build; out=out/${{ matrix.project }}
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$src"/*.bin "$src/flash_args" "$src/flasher_args.json" "$out/"
          cp "$src/bootloader/bootloader.bin" "$out/bootloader/"
          cp "$src/partition_table/partition-table.bin" "$out/partition_table/"
          (cd "$out" && find . -name '*.bin' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firmware-${{ matrix.project }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: [plan, image, firmware]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-firmware-*
          path: firmware-images
          merge-multiple: true
      - name: Build the release files
        run: |
          name="impress-$VERSION"; mkdir -p dist stage
          # Release notes: the line's template with this version and the merged pull requests.
          args=(-f tag_name="$TAG" -f target_commitish="$SHA")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" -q .body > generated.md
          PYTHONPATH=scripts python3 -c 'import release; print(release.clean_changes(open("generated.md").read()))' > changes.md
          python3 scripts/release.py notes "$VERSION" changes.md > notes.md
          # Firmware: one folder per board, flashable with esptool (see the release notes).
          (cd firmware-images && zip -qr "../dist/$name-firmware.zip" .)
          # Documentation: repository docs, the wiki and the release notes.
          mkdir -p "stage/$name-docs"
          cp -r README.md CONTRIBUTING.md CODE_OF_CONDUCT.md docs "stage/$name-docs/"
          cp notes.md "stage/$name-docs/RELEASE_NOTES.md"
          git clone -q --depth 1 "https://github.com/$GITHUB_REPOSITORY.wiki.git" "stage/$name-docs/wiki"
          rm -rf "stage/$name-docs/wiki/.git"
          (cd stage && zip -qr "../dist/$name-docs.zip" "$name-docs")
          # Bundle: the source at the release commit, the firmware images and the notes.
          git archive --format=tar --prefix="$name/" "$SHA" | tar -x -C stage
          printf '%s\n' "$VERSION" | tee "stage/$name/VERSION" stage/"$name"/firmware/{class_c6,class_s3,student}/version.txt >/dev/null
          mkdir -p "stage/$name/release"
          cp -r firmware-images "stage/$name/release/firmware"
          cp notes.md "stage/$name/release/RELEASE_NOTES.md"
          (cd stage && zip -qr "../dist/$name.zip" "$name")
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Tag the release commit
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)" = "$SHA"
      - name: Publish
        run: |
          # Published as a pre-release; the status job adds the badge and the
          # open test issues, and sets Beta or Stable a few seconds later.
          gh release create "$TAG" --verify-tag --prerelease --title "imPress $VERSION (Beta)" \
            --notes-file notes.md dist/*.zip dist/SHA256SUMS.txt
          echo "Published $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"

  status:
    name: Release status
    needs: [plan, release]
    # Runs for every event, after a release (if one was created) is published.
    if: always() && !cancelled() && needs.release.result != 'failure' && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Beta or Stable
        run: python3 scripts/release.py sync | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Image channels (latest = newest stable, beta = newest beta)
        run: |
          channels=$(python3 scripts/release.py channels)
          echo "$channels" >> "$GITHUB_STEP_SUMMARY"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for channel in latest beta; do
            version=$(jq -r ".$channel // empty" <<<"$channels")
            [ -n "$version" ] || continue
            if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE:$channel" "$IMAGE:$version"
            else
              echo "no image $IMAGE:$version yet; $channel not moved"
            fi
          done
