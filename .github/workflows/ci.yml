name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests

  firmware-static:
    name: Firmware structural tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest firmware/tests
        run: |
          if [ -d firmware/tests ]; then python -m pytest -q firmware/tests; else echo "no firmware/tests"; fi

  firmware-host:
    name: Firmware host tests (cc + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: firmware/run_host_tests.sh

  firmware-build:
    name: ESP-IDF v6.1 build (${{ matrix.project }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        project: [class_c6, class_s3, student]
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py build

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
