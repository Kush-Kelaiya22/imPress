name: CI

# Pull requests get CI through `pull_request`; pushes only run on long-lived
# branches, so a PR branch isn't built twice per push.
on:
  push:
    branches: [main, v2, v3, "varun/**", "kush/**", "aamna/**", "encrypted/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Third-party actions and images are pinned to immutable commits/digests;
# the trailing comment names the release. Update them together.
jobs:
  repo:
    name: Repository and CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r backend/requirements-lock.txt
      - name: Lint workflow (actionlint + shellcheck)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color
      - name: Lint Python (ruff, pyflakes rules)
        run: ruff check --output-format github .
      - name: Byte-compile sources
        run: python -m compileall -q backend/app run_tests.py tests firmware/tests
      - name: Repository, CI and docs checks
        run: python run_tests.py --suite repo --junit-dir reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-repo
          path: reports/
          retention-days: 14

  changelog:
    # Every pull request records its change in CHANGELOG.md (CONTRIBUTING §14.4);
    # the label `no-changelog` exempts a change with nothing to tell users.
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CHANGELOG.md changed (pull requests only)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "not a pull request: nothing to check"; exit 0; fi
          if jq -e 'index("no-changelog")' <<<"$LABELS" >/dev/null; then echo "label no-changelog: skipped"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error file=CHANGELOG.md::Add an entry under '## [Unreleased]' (Added, Changed, Removed, Fixed or Security), or label the pull request no-changelog. See CONTRIBUTING §14.4."
            exit 1
          fi
          python3 scripts/release.py check-changelog

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Python dependencies (pip-audit, locked set)
        run: |
          pip install "pip-audit>=2.7"
          pip-audit --strict --disable-pip --require-hashes -r backend/requirements-lock.txt
      - name: Frontend dependencies (npm audit, high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r backend/requirements-lock.txt
      - name: pytest backend/tests (with coverage)
        run: python run_tests.py --suite backend --junit-dir reports --coverage reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-backend
          path: reports/
          retention-days: 14

  firmware-static:
    name: Firmware structural tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest
        run: pip install "pytest>=8"
      - name: pytest firmware/tests
        run: python run_tests.py --suite firmware-static --junit-dir reports

  firmware-host:
    name: Firmware host tests (gcc + ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Host C suites
        run: python run_tests.py --suite host

  firmware-build:
    name: ESP-IDF v6.1 build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        project: [class_c6, class_s3, student]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: idf.py build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py build
      - name: Size report
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Image checksums
        shell: bash
        run: |
          cd firmware/${{ matrix.project }}/build
          sha256sum ./*.bin bootloader/bootloader.bin partition_table/partition-table.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.project }}
          path: |
            firmware/${{ matrix.project }}/build/*.bin
            firmware/${{ matrix.project }}/build/bootloader/bootloader.bin
            firmware/${{ matrix.project }}/build/partition_table/partition-table.bin
            firmware/${{ matrix.project }}/build/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  firmware-signed:
    # The signed-app profile (#66) with a throwaway key made for this run:
    # it builds, and the backend's verifier accepts the result and names the key.
    name: ESP-IDF v6.1 signed and TLS builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway signing key, signed build, verification
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          scripts/firmware_key.sh "$RUNNER_TEMP/key"
          IMPRESS_SIGNING_KEY="$RUNNER_TEMP/key/signing_key.pem" scripts/build_signed.sh class_c6
          python3 scripts/verify_firmware.py firmware/class_c6/build/signed/impress_class_c6.bin \
            --key "$RUNNER_TEMP/key/signing_key.pub"
          grep -q '^CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y' firmware/class_c6/build/signed/sdkconfig
      - name: Backend over TLS (#66) - C6 with public CAs, S3 with an embedded CA
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          variant() {   # the committed sdkconfig plus TLS options, in build/tls
            p=$1; shift; d=firmware/$p/build/tls; mkdir -p "$d"
            grep -Ev '^(# )?CONFIG_BACKEND_TLS' "firmware/$p/sdkconfig" > "$d/sdkconfig"
            printf '%s\n' "$@" >> "$d/sdkconfig"
            (cd "firmware/$p" && idf.py -B build/tls -D SDKCONFIG=build/tls/sdkconfig build)
          }
          variant class_c6 CONFIG_BACKEND_TLS=y CONFIG_BACKEND_TLS_CRT_BUNDLE=y
          mkdir -p firmware/class_s3/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-ca" \
            -keyout "$RUNNER_TEMP/ca.key" -out firmware/class_s3/certs/backend_ca.pem 2>/dev/null
          variant class_s3 CONFIG_BACKEND_TLS=y CONFIG_BACKEND_TLS_CA_FILE=y

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + vite build
        run: python3 run_tests.py --suite frontend

  ui:
    name: Browser UI checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies + Playwright Chromium
        run: |
          pip install --require-hashes -r backend/requirements-lock.txt
          pip install "$(grep '^playwright==' ui_tests/requirements.txt)"
          python -m playwright install --with-deps chromium
      - name: Browser UI checks
        run: python run_tests.py --suite ui --junit-dir reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: |
            ui_tests/screenshots/
            reports/
          retention-days: 14

  install-smoke:
    # The documented install path on a fresh runner (#42): scripts/install.sh
    # into a new venv, scripts/start.sh, then the HTTP smoke test.
    name: Clean install + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMPRESS_INITIAL_ADMIN_PASSWORD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: scripts/install.sh
        run: scripts/install.sh
      - name: scripts/start.sh
        run: |
          nohup scripts/start.sh > server.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: HTTP smoke test
        run: python scripts/smoke_test.py --password "$IMPRESS_INITIAL_ADMIN_PASSWORD"
      - name: HTTPS smoke test (#66, a throwaway CA)
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" 2>/dev/null
          IMPRESS_PORT=8443 IMPRESS_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/tls.db" \
            IMPRESS_SSL_CERTFILE="$RUNNER_TEMP/tls.crt" IMPRESS_SSL_KEYFILE="$RUNNER_TEMP/tls.key" \
            nohup scripts/start.sh > tls.log 2>&1 &
          for _ in $(seq 60); do curl -sf --cacert "$RUNNER_TEMP/tls.crt" https://127.0.0.1:8443/health && break; sleep 1; done
          python scripts/smoke_test.py --base https://127.0.0.1:8443 --password "$IMPRESS_INITIAL_ADMIN_PASSWORD" \
            --cafile "$RUNNER_TEMP/tls.crt"
          if python scripts/smoke_test.py --base https://127.0.0.1:8443 --password x 2>/dev/null; then
            echo "an untrusted certificate was accepted"; exit 1; fi
      - name: Server log
        if: always()
        run: cat server.log tls.log 2>/dev/null || true

  result:
    name: CI result
    if: always()
    needs: [repo, changelog, security, backend, firmware-static, firmware-host, firmware-build, firmware-signed, frontend, ui, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' | column -t
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
