name: CI

# Pull requests get CI through `pull_request`; pushes only run on long-lived
# branches, so a PR branch isn't built twice per push.
on:
  push:
    branches: [main, v2, v3, "varun/**", "kush/**", "aamna/**", "encrypted/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Third-party actions and images are pinned to immutable commits/digests;
# the trailing comment names the release. Update them together.
jobs:
  repo:
    name: Repository and CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r backend/requirements-lock.txt
      - name: Lint workflow (actionlint + shellcheck)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color
      - name: Lint Python (ruff, pyflakes rules)
        run: ruff check --output-format github .
      - name: Byte-compile sources
        run: python -m compileall -q backend/app run_tests.py tests firmware/tests
      - name: Repository, CI and docs checks
        run: python run_tests.py --suite repo --junit-dir reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-repo
          path: reports/
          retention-days: 14

  changelog:
    # Every pull request records its change in CHANGELOG.md (CONTRIBUTING §14.4);
    # the label `no-changelog` exempts a change with nothing to tell users.
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CHANGELOG.md changed (pull requests only)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "not a pull request: nothing to check"; exit 0; fi
          if jq -e 'index("no-changelog")' <<<"$LABELS" >/dev/null; then echo "label no-changelog: skipped"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error file=CHANGELOG.md::Add an entry under '## [Unreleased]' (Added, Changed, Removed, Fixed or Security), or label the pull request no-changelog. See CONTRIBUTING §14.4."
            exit 1
          fi
          python3 scripts/release.py check-changelog

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Python dependencies (pip-audit, locked set)
        run: |
          pip install "pip-audit>=2.7"
          pip-audit --strict --disable-pip --require-hashes -r backend/requirements-lock.txt
      - name: Frontend dependencies (npm audit, high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies
        run: pip install --require-hashes -r backend/requirements-lock.txt
      - name: pytest backend/tests (with coverage)
        run: python run_tests.py --suite backend --junit-dir reports --coverage reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-backend
          path: reports/
          retention-days: 14

  firmware-static:
    name: Firmware structural tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest
        run: pip install "pytest>=8"
      - name: pytest firmware/tests
        run: python run_tests.py --suite firmware-static --junit-dir reports

  firmware-host:
    name: Firmware host tests (gcc + ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Host C suites
        run: python run_tests.py --suite host

  firmware-build:
    name: ESP-IDF v6.1 build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        project: [class_c6, class_s3, student]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: idf.py build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py build
      - name: Size report
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          cd firmware/${{ matrix.project }}
          idf.py size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Image checksums
        shell: bash
        run: |
          cd firmware/${{ matrix.project }}/build
          sha256sum ./*.bin bootloader/bootloader.bin partition_table/partition-table.bin | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.project }}
          path: |
            firmware/${{ matrix.project }}/build/*.bin
            firmware/${{ matrix.project }}/build/bootloader/bootloader.bin
            firmware/${{ matrix.project }}/build/partition_table/partition-table.bin
            firmware/${{ matrix.project }}/build/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  firmware-emulator:
    # TrustedInstaller qualification, stage 3 (#154): the hub and student
    # firmware boot in Espressif's QEMU from a real flash layout, run their
    # start-up code and stay up. An emulator build (sdkconfig.qemu) skips only
    # what QEMU lacks: the radio, the gateway SPI link, octal/QIO flash and
    # light-sleep idle. There is no emulator for the ESP32-C6 gateway.
    name: Emulator boot test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: class_s3
            machine: esp32s3
            flash_mb: 16
            banner: imPress S3 Class Module
          - project: student
            machine: esp32
            flash_mb: 4
            banner: imPress Student Module
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emulator build (production sdkconfig + sdkconfig.qemu)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          d="$PWD/firmware/${{ matrix.project }}"
          idf.py -C "$d" -B "$RUNNER_TEMP/qemu" -D SDKCONFIG="$RUNNER_TEMP/sdkconfig.qemu" \
            -D "SDKCONFIG_DEFAULTS=$d/sdkconfig;$d/sdkconfig.qemu" build
          idf.py -C "$d" -B "$RUNNER_TEMP/qemu" -D SDKCONFIG="$RUNNER_TEMP/sdkconfig.qemu" merge-bin -o qemu-full.bin
      - name: Boot in QEMU
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python3 scripts/qemu_boot.py --machine ${{ matrix.machine }} --flash-mb ${{ matrix.flash_mb }} \
            --image "$RUNNER_TEMP/qemu/qemu-full.bin" --seconds 120 --log qemu-boot.log \
            --expect "${{ matrix.banner }}" --expect "EMULATOR:" --expect "EMULATOR: alive 10 s" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qemu-boot-${{ matrix.project }}
          path: qemu-boot.log
          retention-days: 7

  firmware-signed:
    # The signed-app profile (#66) with a throwaway key made for this run:
    # it builds, and the backend's verifier accepts the result and names the key.
    name: ESP-IDF v6.1 signed and TLS builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway signing key, signed build, verification
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          scripts/firmware_key.sh "$RUNNER_TEMP/key"
          IMPRESS_SIGNING_KEY="$RUNNER_TEMP/key/signing_key.pem" scripts/build_signed.sh class_c6
          python3 scripts/verify_firmware.py firmware/class_c6/build/signed/impress_class_c6.bin \
            --key "$RUNNER_TEMP/key/signing_key.pub"
          grep -q '^CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y' firmware/class_c6/build/signed/sdkconfig
      - name: Backend over TLS (#66) - C6 with public CAs, S3 with an embedded CA
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          variant() {   # the committed sdkconfig plus TLS options, in build/tls
            p=$1; shift; d=firmware/$p/build/tls; mkdir -p "$d"
            grep -Ev '^(# )?CONFIG_BACKEND_TLS' "firmware/$p/sdkconfig" > "$d/sdkconfig"
            printf '%s\n' "$@" >> "$d/sdkconfig"
            (cd "firmware/$p" && idf.py -B build/tls -D SDKCONFIG=build/tls/sdkconfig build)
          }
          variant class_c6 CONFIG_BACKEND_TLS=y CONFIG_BACKEND_TLS_CRT_BUNDLE=y
          mkdir -p firmware/class_s3/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci-ca" \
            -keyout "$RUNNER_TEMP/ca.key" -out firmware/class_s3/certs/backend_ca.pem 2>/dev/null
          variant class_s3 CONFIG_BACKEND_TLS=y CONFIG_BACKEND_TLS_CA_FILE=y

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + vite build
        run: python3 run_tests.py --suite frontend

  docs:
    name: Hosted documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Build Read the Docs site with warnings as errors
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -E -W --keep-going -b html docs docs/_build/html
          test -s docs/_build/html/graph/index.html
          test -s docs/_build/html/graph/visualization.html
          test -s docs/_build/html/graph/graph.json
          test -s docs/_build/html/searchindex.js

  ui:
    name: Browser UI checks (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked dependencies + Playwright Chromium
        run: |
          pip install --require-hashes -r backend/requirements-lock.txt
          pip install "$(grep '^playwright==' ui_tests/requirements.txt)"
          python -m playwright install --with-deps chromium
      - name: Browser UI checks
        run: python run_tests.py --suite ui --junit-dir reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: |
            ui_tests/screenshots/
            reports/
          retention-days: 14

  install-smoke:
    # The documented install path on a fresh runner (#42): scripts/install.sh
    # into a new venv, scripts/start.sh, then the HTTP smoke test.
    name: Clean install + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMPRESS_INITIAL_ADMIN_PASSWORD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: scripts/install.sh
        run: scripts/install.sh
      - name: scripts/start.sh
        run: |
          nohup scripts/start.sh > server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/impress-http.pid"
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: HTTP smoke test
        run: python scripts/smoke_test.py --password "$IMPRESS_INITIAL_ADMIN_PASSWORD"
      - name: HTTPS smoke test (#66, a throwaway CA)
        run: |
          http_pid="$(cat "$RUNNER_TEMP/impress-http.pid")"
          kill -TERM "$http_pid"
          for _ in $(seq 30); do
            if ! kill -0 "$http_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$http_pid" 2>/dev/null; then
            echo "HTTP server did not stop before the TLS run"; cat server.log; exit 1
          fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.crt" 2>/dev/null
          IMPRESS_PORT=8443 IMPRESS_DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/tls.db" \
            IMPRESS_SSL_CERTFILE="$RUNNER_TEMP/tls.crt" IMPRESS_SSL_KEYFILE="$RUNNER_TEMP/tls.key" \
            nohup scripts/start.sh > tls.log 2>&1 &
          for _ in $(seq 60); do curl -sf --cacert "$RUNNER_TEMP/tls.crt" https://127.0.0.1:8000/health && break; sleep 1; done
          python scripts/smoke_test.py --base https://127.0.0.1:8000 --password "$IMPRESS_INITIAL_ADMIN_PASSWORD" \
            --cafile "$RUNNER_TEMP/tls.crt"
          if python scripts/smoke_test.py --base https://127.0.0.1:8000 --password x 2>/dev/null; then
            echo "an untrusted certificate was accepted"; exit 1; fi
      - name: Server log
        if: always()
        run: cat server.log tls.log 2>/dev/null || true

  launchers:
    # The one-file launchers (v2.2) on each system: install from nothing,
    # ignore host/port overrides, and serve /health on 0.0.0.0:8000.
    name: Launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      IMPRESS_HOST: "127.0.0.1"
      IMPRESS_PORT: "8123"
      IMPRESS_INITIAL_ADMIN_PASSWORD: launcher-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: launcher.sh
        if: runner.os != 'Windows'
        run: |
          nohup ./launcher.sh > launcher.log 2>&1 &
          for _ in $(seq 120); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat launcher.log; exit 1
      - name: launcher.bat
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c', 'launcher.bat > launcher.log 2>&1' -WindowStyle Hidden
          foreach ($i in 1..120) {
            try { Invoke-RestMethod "http://127.0.0.1:8000/health"; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content launcher.log; exit 1
      - name: HTTP smoke test
        shell: bash
        run: python scripts/smoke_test.py --base http://127.0.0.1:8000 --password "$IMPRESS_INITIAL_ADMIN_PASSWORD"
      - name: Launcher log
        if: always()
        shell: bash
        run: cat launcher.log 2>/dev/null || true

  container:
    # The release image for both architectures (#136), built and smoke-tested
    # natively on every change; nothing is pushed here.
    name: Container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMPRESS_INITIAL_ADMIN_PASSWORD: smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Use the containerd image store
        # The classic store pushes Docker v2 manifests; their manifest list
        # can't carry annotations, so the package page lost its description
        # (#136). The containerd store pushes OCI images and indexes.
        run: |
          f=/etc/docker/daemon.json
          { sudo test -s "$f" && sudo cat "$f" || echo '{}'; } | jq '.features["containerd-snapshotter"] = true' | sudo tee "$f.new" > /dev/null
          sudo mv "$f.new" "$f" && sudo systemctl restart docker
          for _ in $(seq 60); do docker info > /dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Build
        run: docker build --platform linux/${{ matrix.arch }} -t impress-backend:ci .
      - name: Smoke test
        run: |
          docker run -d --name impress -p 8000:8000 -e IMPRESS_REQUIRE_HTTPS=false -e IMPRESS_INITIAL_ADMIN_PASSWORD impress-backend:ci
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          key=$(docker exec impress sed -n 's/^IMPRESS_DEVICE_API_KEY=\([^ #]*\).*/\1/p' /data/.env)
          python scripts/smoke_test.py --password "$IMPRESS_INITIAL_ADMIN_PASSWORD" --device-key="$key"
          test "$(docker exec impress uname -m)" = "$([ ${{ matrix.arch }} = arm64 ] && echo aarch64 || echo x86_64)"
          docker exec -w /app/backend impress python -m app.manage --help > /dev/null   # the recovery command (#120)
      - name: Push and annotate like the release (local registry)
        # The release's push → join → annotate path on this runner, without
        # ghcr.io: the joined index must be OCI and keep its annotation.
        run: |
          docker run -d -p 5000:5000 --name registry registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for _ in $(seq 30); do curl -sf http://127.0.0.1:5000/v2/ > /dev/null && break; sleep 1; done
          docker tag impress-backend:ci localhost:5000/impress:${{ matrix.arch }}
          docker push localhost:5000/impress:${{ matrix.arch }}
          docker buildx imagetools create -t localhost:5000/impress:index \
            --annotation "index:org.opencontainers.image.description=ci check" localhost:5000/impress:${{ matrix.arch }}
          docker buildx imagetools inspect localhost:5000/impress:index --raw | jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json"
            and .annotations["org.opencontainers.image.description"] == "ci check"' 
      - name: Container log
        if: always()
        run: docker logs impress 2>&1 | grep -v 'Device API key' || true

  result:
    name: CI result
    if: always()
    needs: [repo, changelog, security, backend, firmware-static, firmware-host, firmware-build, firmware-signed, frontend, docs, ui, install-smoke, launchers, container, firmware-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' | column -t
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
